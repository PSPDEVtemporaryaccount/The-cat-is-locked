name: Build The Cat Is Locked PSP
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  prepare-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install audio decoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Prepare menu audio
        run: python3 tools/prepare_assets.py
      - name: Upload menu audio
        uses: actions/upload-artifact@v4
        with:
          name: menu-audio
          path: |
            build/menu_audio.pcm
          if-no-files-found: error
          retention-days: 1

  build:
    needs: prepare-assets
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download menu audio
        uses: actions/download-artifact@v4
        with:
          name: menu-audio
          path: build
      - name: Build PSP EBOOT
        run: make clean && make
      - name: Upload EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: The-Cat-Is-Locked-Beta-0.8.0
          path: EBOOT.PBP
          if-no-files-found: error
          retention-days: 30
